[package]
name = "real_estate_allocation_embeds"
version = "0.1.0"
edition = "2024"

# The cross-origin microfrontend bundle: a self-registering custom element built
# with `wasm-bindgen --target web` (manganis-free — see `ev_lib::mfe`). A real CSR
# widget — `dioxus/web` only, no fullstack/hydration. All the producer boilerplate
# is the `mfe!` macro.
[lib]
crate-type = ["cdylib"]

# The cross-origin bundle proper (`src/lib.rs`, `#![cfg(target_arch = "wasm32")]`): a real
# CSR widget (`dioxus/web` only — no fullstack, no hydration) plus `ev_lib::mfe` + the
# `web-sys`/`gloo-net` live fetch.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, features = ["web"] }
ev_lib = { workspace = true, features = ["wasm", "mfe"] }
getrandom = { workspace = true, features = ["wasm_js"] }
# Transitive 0.3 (ahash ← ustr ← v_utils): enable its wasm_js backend feature, the
# same alias the main crate's wasm build uses. The backend cfg (`getrandom_backend`)
# is set in the flake `mfeSteps` RUSTFLAGS for the bundle build.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
gloo-net.workspace = true
uuid = { workspace = true, features = ["js"] }
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "Event", "EventTarget", "MouseEvent", "PointerEvent", "UiEvent"] }

# Native-compilable presentation layer (`src/view.rs`): the same components render the
# live wasm bundle AND the static `portfolio.html` snapshot, so their deps must build off
# `wasm32`. `dioxus` here is default features only (NO `web`); the wasm target below adds
# `web`. Reaches REA's data over plain HTTP, so it depends on the fullstack-free `core`
# crate, not the full REA lib.
[dependencies]
dioxus.workspace = true
ev_lib = { workspace = true, features = ["architecture", "i18n", "uikit"] }
real_estate_allocation_core.workspace = true
# Parses the five `messages/<locale>/common.json` catalogues. Free in the wasm
# bundle — `gloo-net`'s json feature already links it for the live fetch.
serde_json.workspace = true

# `examples/portfolio_snapshot.rs` renders `view` to static HTML natively — dev-only, so
# the wasm cdylib never links it.
[dev-dependencies]
dioxus-ssr.workspace = true

[lints]
workspace = true
