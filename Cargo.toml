cargo-features = ["codegen-backend"]

[workspace]
members = ["analytics", "analytics_*"]
default-members = ["analytics"]
resolver = "3"

[workspace.package]
version = "0.4.0"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
doc_lazy_continuation = "allow"
get_first = "allow"
get_last_with_len = "allow"
manual_is_multiple_of = "allow"

[workspace.lints.rust]
unused_features = "allow"

[workspace.lints.cargo]
non_kebab_case_bins = "allow"

[workspace.dependencies]
clap = { version = "^4.6", features = ["derive"] }
color-eyre = "^0.6"
derive-new = "^0.7"
miette = { version = "^7.6", features = ["fancy", "serde", "syntect-highlighter"] }
reqwest = { version = "^0.13", default-features = false, features = ["json", "rustls"] }
tilers = { version = "0.2.0", features = ["dioxus"] }
v_utils = { version = "^2.15.56", features = ["io", "macros", "cli"] }

# microfrontend stack — pinned to the exact revs `site` verified against.
analytics = { path = "analytics", default-features = false }
analytics_core = { path = "analytics_core" }
async-trait = "^0.1"
dioxus = { version = "^0.7" }
dioxus-fullstack = "^0.7"
dioxus-ssr = "0.7"
ev_lib = "^0.24.2"
getrandom = { version = "^0.4", features = ["wasm_js"] }
gloo-net = "^0.7"
insta = "^1"
jiff = { version = "^0.2", features = ["serde"] }
secrecy = "^0.10"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
smart-default = "^0.7"
sqlx = { version = "^0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
strum = "0.28.0"
thiserror = "^2.0"
tokio = { version = "^1", features = ["full"] }
uuid = { version = "^1", features = ["serde", "v4"] }
wasm-bindgen = "=0.2.125" #NB: don't bump carelessly, - must match installed
web-sys = "0.3"

[patch.crates-io]
#ev_lib = { path = "../../lib/rust" }
